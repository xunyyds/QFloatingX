name: 同步Gitee到QFloatingX并自动PR
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: QF
          persist-credentials: false

      - name: 配置Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加Gitee源
        run: |
          git remote add gitee https://gitee.com/ovoxiaomo/qfloating-x.git 2>/dev/null || true
          git fetch gitee QF

      - name: 对比提交是否有更新
        id: check
        run: |
          REMOTE=$(git rev-parse gitee/QF)
          LOCAL=$(git rev-parse origin/sync-from-gitee 2>/dev/null || echo "none")
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 强制同步代码
        if: steps.check.outputs.update == 'true'
        run: |
          git checkout -B sync-from-gitee gitee/QF
          git push -f https://xunyyds:${{ secrets.GITHUB_TOKEN }}@github.com/xunyyds/QFloatingX.git sync-from-gitee

      - name: 创建PR到QF分支
        if: steps.check.outputs.update == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: 'xunyyds',
              repo: 'QFloatingX',
              head: 'xunyyds:sync-from-gitee',
              base: 'QF',
              state: 'open'
            });
            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: 'xunyyds',
                repo: 'QFloatingX',
                head: 'sync-from-gitee',
                base: 'QF',
                title: '自动同步 Gitee 最新提交',
                body: '来自 https://gitee.com/ovoxiaomo/qfloating-x\nCommit: ${{ steps.check.outputs.remote }}'
              });
            }
