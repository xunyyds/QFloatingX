name: 同步Gitee仓库到GitHub Fork
on:
  # 手动触发（随时在Actions页面点击运行）
  workflow_dispatch:
  # 定时触发（默认每天北京时间8点同步，可自行修改cron表达式）
  schedule:
    - cron: '0 0 * * *'

permissions:
  # 给Action写入仓库代码的权限
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，避免合并冲突
          ref: main # 你的仓库默认分支，若为master请修改

      - name: 配置Git用户信息
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: 添加Gitee来源仓库远程地址
        run: |
          git remote add source https://gitee.com/ovoxiaomo/qfloating-x.git
          git remote set-url --push source DISABLED # 禁止反向推送到Gitee，避免误操作

      - name: 拉取Gitee仓库最新代码
        run: |
          git fetch source

      - name: 创建同步分支并强制同步Gitee代码
        run: |
          # 新建/切换到专属同步分支（不会污染你的主分支）
          git checkout -B sync-gitee-latest
          # 强制重置分支与Gitee来源仓库的main分支完全一致，无冲突
          git reset --hard source/main
          # 强制推送到你的GitHub仓库
          git push origin sync-gitee-latest --force

     #  【可选功能】自动向上游原仓库创建PR，不需要可删除本段
       - name: 自动向上游仓库创建PR
        uses: repo-sync/pull-request@v2
       with:
          source_branch: sync-gitee-latest
          destination_branch: main
         pr_title: "同步Gitee仓库最新更新"
          pr_body: "自动同步来自 https://gitee.com/ovoxiaomo/qfloating-x 的最新代码"
         destination_repo: xunyyds/QFloatingX
           github_token: ${{ secrets.GITHUB_TOKEN }}
